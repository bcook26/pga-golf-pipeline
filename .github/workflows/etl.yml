name: Daily ETL

# Loads new stats and tournament results into the hosted database.
# Needs repository secrets DATABASE_URL (owner role) and PGA_GRAPHQL_KEY.
# Scheduled workflows only run from the repository's default branch.
on:
  schedule:
    - cron: "17 9 * * *" # daily, 09:17 UTC
  workflow_dispatch:

concurrency:
  group: etl
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - name: Incremental load
        working-directory: etl
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGA_GRAPHQL_KEY: ${{ secrets.PGA_GRAPHQL_KEY }}
        run: uv run python full_pipeline.py --mode incremental
