name: Code Format Check

on: [push, pull_request]  # Run on push and pull request events

jobs:
  format:
    name: Check code formatting with Black and isort
    runs-on: ubuntu-latest  # Use the latest Ubuntu runner

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # Get the repository code

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # Specify Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black isort  # Install formatting tools

      - name: Run black
        run: black --check .  # Check code formatting with Black

      - name: Run isort
        run: isort --check-only .  # Check import sorting with isort
