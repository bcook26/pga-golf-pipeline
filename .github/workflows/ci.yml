name: CI

on: [push, pull_request]

jobs:
  test:
    name: Type check and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install dependencies
        run: uv sync --dev
      - name: mypy
        run: uv run mypy etl
      - name: pytest
        run: uv run pytest -q
