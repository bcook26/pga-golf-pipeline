[project]
name = "golf-etl-fast-api"
version = "0.1.0"
description = "ETL pipeline for PGA Tour data"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "beautifulsoup4",
    "pandas",
]

[tool.black]
line-length = 88
target-version = ['py312']
skip-string-normalization = false
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["golf-etl-fast-api"]
skip_gitignore = true
