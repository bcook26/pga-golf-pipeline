[project]
name = "golf-etl-fast-api"
version = "0.1.0"
description = "ETL pipeline for PGA Tour data"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "beautifulsoup4",
    "pandas",
    "tqdm>=4.70.0",
    "sqlalchemy>=2.0.52",
    "python-dotenv>=1.2.3",
    "psycopg[binary]>=3.3.4",
    "redis>=8.1.0",
]

[tool.black]
line-length = 88
target-version = ['py312']
skip-string-normalization = false
exclude = '''
/(
    \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["golf-etl-fast-api"]
skip_gitignore = true

[dependency-groups]
dev = [
    "black>=26.10.1",
    "flake8>=7.5.0",
    "isort>=9.0.2",
    "mypy>=2.4.1",
    "pandas-stubs>=3.1.0.261029",
    "pytest>=9.2.0",
    "types-beautifulsoup4>=4.12.0.20250516",
    "types-requests>=2.33.0.20261030",
]

[tool.pytest.ini_options]
pythonpath = ["etl"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
mypy_path = "etl"
explicit_package_bases = true
ignore_missing_imports = true
