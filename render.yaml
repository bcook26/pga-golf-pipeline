# Render Blueprint: the API on the free plan. See docs/DEPLOY.md.
services:
  - type: web
    name: golf-stats-api
    runtime: docker
    plan: free
    dockerfilePath: ./docker/api.Dockerfile
    dockerContext: .
    # /live never touches the database, so health checks cannot keep the
    # serverless database awake (and burn its free compute hours).
    healthCheckPath: /live
    autoDeploy: true
    envVars:
      - key: DATABASE_URL # Neon connection string (read-only role recommended)
        sync: false
      - key: CORS_ORIGINS # your Netlify site, e.g. https://golf-stats-lab.netlify.app
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "60"
      - key: RATE_LIMIT_PER_HOUR
        value: "600"
      - key: RATE_LIMIT_GLOBAL_PER_HOUR
        value: "3000"
      # Number of proxies in front of the app that append to X-Forwarded-For.
      # Verify after deploying (docs/DEPLOY.md, "Check the rate limiter").
      - key: RATE_LIMIT_PROXY_HOPS
        value: "1"
