# Netlify builds the React app from frontend/. Set VITE_API_URL in the Netlify
# UI (Site configuration > Environment variables) to the Render API URL; it is
# baked into the bundle at build time. See docs/DEPLOY.md.
[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: every path serves index.html so deep links and refreshes work.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
