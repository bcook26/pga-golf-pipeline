# Local dev stack.
#   docker compose up -d                       # Postgres + Redis
#   docker compose --profile airflow up -d     # + Airflow (UI on :8080)
#
# Host ports default to 5433/6379 so Postgres does not collide with a native
# install on 5432. Point the ETL at it with ETL_DB_PORT=5433 in .env.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${ETL_DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: ${ETL_DB_NAME:-pga_golf_etl}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # *.sql here run once, on first start of an empty volume
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ETL_DB_USER:-postgres} -d ${ETL_DB_NAME:-pga_golf_etl}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  airflow:
    profiles: ["airflow"]
    build:
      context: .
      dockerfile: docker/airflow.Dockerfile
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${ETL_DB_USER:-postgres}:${DB_PASSWORD}@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # ETL settings inside the compose network
      ETL_DB_HOST: postgres
      ETL_DB_PORT: "5432"
      ETL_DB_NAME: ${ETL_DB_NAME:-pga_golf_etl}
      ETL_DB_USER: ${ETL_DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8080:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./etl:/opt/airflow/etl:ro
    # `standalone` = dev-only all-in-one (scheduler + webserver); admin
    # password is printed in the container logs.
    command: standalone

volumes:
  pgdata:
